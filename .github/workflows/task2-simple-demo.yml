name: Task2 Simple Demo

on:
  push:
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/task2-simple-demo.yml"
  pull_request:
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/task2-simple-demo.yml"
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print basic context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch ref: ${{ github.ref }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform version
        run: terraform version

      - name: Terraform init, validate and plan (no backend)
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "Task2Advanced/envs/dev" ]; then
            TF_DIR="Task2Advanced/envs/dev"
          elif [ -d "architecture-future_pro_2_0/Task2Advanced/envs/dev" ]; then
            TF_DIR="architecture-future_pro_2_0/Task2Advanced/envs/dev"
          else
            echo "Cannot find Task2Advanced/envs/dev"
            pwd
            ls -la
            exit 1
          fi

          cd "$TF_DIR"
          cp versions.tf versions.tf.bak
          # Demo mode: remove backend declaration to allow local plan without secrets.
          sed '/backend "s3" {}/d' versions.tf.bak > versions.tf
          cat > ci.auto.tfvars <<'EOF'
          cloud_id       = "demo-cloud-id"
          folder_id      = "demo-folder-id"
          zone           = "ru-central1-a"
          vm_name        = "demo-vm"
          cores          = 2
          memory_gb      = 2
          disk_size_gb   = 10
          subnet_id      = "demo-subnet-id"
          ssh_public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDemoPublicKeyForCIOnly"
          EOF
          terraform init -backend=false -input=false
          terraform validate
          terraform plan -input=false -refresh=false -lock=false

      - name: Validate workflow is running
        run: echo "GitHub Actions demo pipeline completed successfully."
