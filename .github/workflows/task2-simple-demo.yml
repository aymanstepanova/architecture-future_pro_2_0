name: Task2 Simple Demo

on:
  push:
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/task2-simple-demo.yml"
  pull_request:
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/task2-simple-demo.yml"
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print basic context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch ref: ${{ github.ref }}"
          echo "Triggered by: ${{ github.event_name }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform version
        run: terraform version

      - name: Terraform init, validate and plan (no backend)
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "Task2Advanced/envs/dev" ]; then
            TF_DIR="Task2Advanced/envs/dev"
          elif [ -d "architecture-future_pro_2_0/Task2Advanced/envs/dev" ]; then
            TF_DIR="architecture-future_pro_2_0/Task2Advanced/envs/dev"
          else
            echo "Cannot find Task2Advanced/envs/dev"
            pwd
            ls -la
            exit 1
          fi

          cd "$TF_DIR"
          terraform init -backend=false
          terraform validate
          terraform plan -refresh=false -lock=false

      - name: Validate workflow is running
        run: echo "GitHub Actions demo pipeline completed successfully."
