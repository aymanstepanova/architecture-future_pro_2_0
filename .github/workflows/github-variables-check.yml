name: GitHub Variables Check

on:
  workflow_dispatch:
  push:
    branches:
      - task-2
    paths:
      - ".github/workflows/github-variables-check.yml"

jobs:
  check-vars:
    runs-on: ubuntu-latest
    env:
      DEMO_VAR_TEXT: ${{ vars.DEMO_VAR_TEXT }}
      DEMO_VAR_NUMBER: ${{ vars.DEMO_VAR_NUMBER }}
      DEMO_SECRET_TOKEN: ${{ secrets.DEMO_SECRET_TOKEN }}
    steps:
      - name: Show repository variables
        run: |
          echo "DEMO_VAR_TEXT='${DEMO_VAR_TEXT}'"
          echo "DEMO_VAR_NUMBER='${DEMO_VAR_NUMBER}'"

      - name: Check secret exists (without printing)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DEMO_SECRET_TOKEN}" ]; then
            echo "DEMO_SECRET_TOKEN is set"
          else
            echo "DEMO_SECRET_TOKEN is NOT set"
          fi
