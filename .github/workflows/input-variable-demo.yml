name: Input Variable Demo

on:
  push:
    branches:
      - task-2
    paths:
      - ".github/workflows/input-variable-demo.yml"
  workflow_dispatch:
    inputs:
      message:
        description: "Сообщение для вывода в логах"
        required: true
        default: "Привет из GitHub Actions"
        type: string
      repeat_count:
        description: "Сколько раз вывести сообщение"
        required: true
        default: "3"
        type: string

jobs:
  show-input:
    runs-on: ubuntu-latest
    env:
      DEMO_MESSAGE: ${{ github.event.inputs.message || 'Привет из push-trigger' }}
      DEMO_REPEAT_COUNT: ${{ github.event.inputs.repeat_count || '2' }}
    steps:
      - name: Print input values
        run: |
          echo "Message: ${DEMO_MESSAGE}"
          echo "Repeat count: ${DEMO_REPEAT_COUNT}"

      - name: Repeat message
        shell: bash
        run: |
          set -euo pipefail
          count="${DEMO_REPEAT_COUNT}"
          msg="${DEMO_MESSAGE}"

          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "repeat_count must be a non-negative integer"
            exit 1
          fi

          for ((i=1; i<=count; i++)); do
            echo "$i) $msg"
          done
