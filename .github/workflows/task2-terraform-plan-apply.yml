name: Task2 Terraform — plan & apply

on:
  pull_request:
    paths:
      - "Task2Advanced/**"
      - ".github/workflows/task2-terraform-plan-apply.yml"
  workflow_dispatch:
    inputs:
      tf_env:
        description: "Окружение (dev / stage / prod)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - stage
          - prod

concurrency:
  group: task2-terraform-${{ github.event.inputs.tf_env || 'dev' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ github.event.inputs.tf_env || 'dev' }}
  # Общие Variables/Secrets для plan/apply
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_cloud_id: ${{ vars.TF_VAR_CLOUD_ID }}
  TF_VAR_folder_id: ${{ vars.TF_VAR_FOLDER_ID }}
  TF_VAR_zone: ${{ vars.TF_VAR_ZONE }}
  TF_VAR_subnet_id: ${{ vars.TF_VAR_SUBNET_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_SSH_PUBLIC_KEY }}
  YC_TOKEN: ${{ secrets.YC_TOKEN }}
  S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
  # Бэкенд Terraform S3 использует имена переменных окружения AWS_*.
  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

jobs:
  plan-minimal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Ручной запуск подтвержден
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Workflow запущен вручную для окружения ${TF_ENV}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Проверка обязательных Variables/Secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            TF_STATE_BUCKET
            TF_VAR_cloud_id
            TF_VAR_folder_id
            TF_VAR_zone
            TF_VAR_subnet_id
            TF_VAR_ssh_public_key
            YC_TOKEN
            S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Отсутствует обязательное значение: ${name}"
              exit 1
            fi
          done
          echo "Все обязательные Variables/Secrets заданы."

      - name: Terraform init (минимальные входные значения)
        shell: bash
        run: |
          set -euo pipefail
          cd "Task2Advanced/envs/${TF_ENV}"

          cat > backend.hcl <<EOF
          bucket = "${TF_STATE_BUCKET}"
          key    = "task2/${TF_ENV}/terraform.tfstate"
          region = "ru-central1"
          endpoint = "https://storage.yandexcloud.net"
          skip_credentials_validation = true
          skip_region_validation = true
          skip_requesting_account_id = true
          skip_metadata_api_check = true
          use_path_style = true
          skip_s3_checksum = true
          EOF

          # Здесь подставляются только некритичные tf-переменные.
          cat > ci.auto.tfvars <<EOF
          vm_name        = "ci-${TF_ENV}-demo"
          cores          = 2
          memory_gb      = 2
          disk_size_gb   = 10
          subnet_id      = "${TF_VAR_subnet_id}"
          ssh_public_key = "${TF_VAR_ssh_public_key}"
          EOF

          terraform init -input=false -backend-config=backend.hcl

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          cd "Task2Advanced/envs/${TF_ENV}"
          terraform validate

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          cd "Task2Advanced/envs/${TF_ENV}"
          terraform plan -input=false -lock=false -out=tfplan

      - name: Загрузка артефакта плана
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-task2-${{ env.TF_ENV }}-${{ github.sha }}
          path: Task2Advanced/envs/${{ env.TF_ENV }}/tfplan
          retention-days: 7

  apply-simulated:
    name: Apply (manual approval)
    needs: plan-minimal
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: terraform-apply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-task2-${{ env.TF_ENV }}-${{ github.sha }}
          path: downloaded-plan

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform apply (из сохраненного плана)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "Task2Advanced/envs/${TF_ENV}"
          cp -f "downloaded-plan/tfplan" "Task2Advanced/envs/${TF_ENV}/tfplan"
          cd "Task2Advanced/envs/${TF_ENV}"

          cat > backend.hcl <<EOF
          bucket = "${TF_STATE_BUCKET}"
          key    = "task2/${TF_ENV}/terraform.tfstate"
          region = "ru-central1"
          endpoint = "https://storage.yandexcloud.net"
          skip_credentials_validation = true
          skip_region_validation = true
          skip_requesting_account_id = true
          skip_metadata_api_check = true
          use_path_style = true
          skip_s3_checksum = true
          EOF

          terraform init -input=false -backend-config=backend.hcl
          terraform apply -input=false tfplan
